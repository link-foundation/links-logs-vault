[package]
name = "links-logs-vault"
version = "0.19.2"
edition = "2021"
description = "An associative log vault with LiNo text and compact binary stores"
readme = "README.md"
license = "Unlicense"
keywords = ["logging", "search", "lino", "associative", "observability"]
categories = ["development-tools::debugging", "database-implementations"]
repository = "https://github.com/link-foundation/links-logs-vault"
documentation = "https://docs.rs/links-logs-vault"
rust-version = "1.70"

# Narrow allowlist of files shipped in the published `.crate` archive.
# Keeping this list tight prevents docs, case studies, generated CI artifacts,
# changelog fragments, and experiments from silently inflating the release
# archive past the crates.io 10 MiB upload limit. See issue #58.
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "README.md",
    "REQUIREMENTS.md",
    "ARCHITECTURE.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
name = "links_logs_vault"
path = "src/lib.rs"

[[bin]]
name = "links-logs-vault"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
link-cli = "0.2.7"
links-notation = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
regex = "1"
serde_json = "1"
walkdir = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
